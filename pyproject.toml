[project]
name = "commerceos"
version = "0.1.0"
description = "A lossless, agent-native commerce layer for existing stores."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "any-llm-sdk[anthropic,gemini,groq,mistral,ollama,openai]==1.26.0",
  "fastapi==0.141.1",
  "genson==1.4.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "jsonschema==4.26.0",
  "langgraph==1.2.11",
  "pydantic-settings==2.15.0",
  "pymongo==4.17.0",
  "python-dotenv==1.2.3",
  "python-slugify==8.0.4",
  "pyyaml==6.0.3",
  "rapidfuzz==3.14.5",
  "razorpay==2.0.1",
  "ucp-sdk==0.5.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.13.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
